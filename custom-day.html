<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="theme-color" content="#000000">
    <link rel="manifest" href="manifest.webmanifest">
    <link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
    <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-title" content="Workouts">
    <meta name="apple-mobile-web-app-status-bar-style" content="black">
    <title>Your workout | Marco&#x27;s Workout Plans</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <!-- Fonts load without blocking the page, so it still works with a slow or missing connection -->
    <link rel="preload" as="style" href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600&family=Barlow+Condensed:wght@600;700&display=swap" onload="this.onload=null;this.rel='stylesheet'">
    <noscript><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600&family=Barlow+Condensed:wght@600;700&display=swap"></noscript>
    <link rel="stylesheet" href="app.css">
</head>
<!-- custom.js fills in data-page (one per day and session, so "last time" hints work) and the lifts below -->
<body class="day-page" data-view="day" data-page="custom-day.html" data-label="Your program">
    <header class="topbar">
        <div class="topbar-inner">
            <a href="custom.html" class="back-link"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 5l-7 7 7 7"/></svg>Your days</a>
            <div class="topbar-count" data-progress-text><strong>0</strong> of 0 sets</div>
        </div>
        <div class="topbar-bar"><span data-progress-bar></span></div>
    </header>

    <div class="page">
        <section class="hero">
            <p class="hero-context">Your program</p>
            <h1 data-day-title>Workout</h1>
        </section>

        <p class="notice" id="day-missing" hidden></p>

        <main class="lifts" id="lifts"></main>

        <section class="finish" aria-live="polite">
            <h2>Workout complete</h2>
            <p>All sets are done. Tap Finish workout below to save it and start fresh next time.</p>
        </section>

        <div class="day-actions" id="day-actions" hidden>
            <button type="button" class="btn" id="finish-btn">Finish workout</button>
            <a class="btn secondary" id="edit-link" href="custom.html">Edit this day</a>
        </div>
    </div>
    <script src="custom.js"></script>
    <script src="app.js"></script>
</body>
</html>
