<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="theme-color" content="#000000">
    <link rel="manifest" href="manifest.webmanifest">
    <link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
    <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-title" content="Workouts">
    <meta name="apple-mobile-web-app-status-bar-style" content="black">
    <title>Edit day | Marco&#x27;s Workout Plans</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <!-- Fonts load without blocking the page, so it still works with a slow or missing connection -->
    <link rel="preload" as="style" href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600&family=Barlow+Condensed:wght@600;700&display=swap" onload="this.onload=null;this.rel='stylesheet'">
    <noscript><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600&family=Barlow+Condensed:wght@600;700&display=swap"></noscript>
    <link rel="stylesheet" href="app.css">
</head>
<body class="menu-page" data-view="edit">
    <header class="topbar">
        <div class="topbar-inner">
            <a href="custom.html" class="back-link"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 5l-7 7 7 7"/></svg>Your days</a>
        </div>
    </header>

    <div class="page">
        <section class="hero" id="edit-hero">
            <p class="hero-context">Editing day</p>
            <label class="sr-only" for="day-name">Day name</label>
            <input id="day-name" class="name-input" type="text" maxlength="40" autocomplete="off" placeholder="Day name">
            <p class="hero-lede" data-summary></p>
        </section>

        <p class="notice" id="missing" hidden>That day couldn't be found. It may have been deleted. <a href="custom.html">Back to your days</a></p>
        <p class="notice" id="save-error" hidden>Your browser isn't letting this page save. Check that private browsing is off, then try again.</p>

        <div class="ex-list" id="exlist"></div>

        <div class="day-actions" id="edit-actions">
            <button type="button" class="btn secondary" id="add-ex">+ Add exercise</button>
            <a class="btn" id="start-link" href="custom.html" hidden>Start this workout</a>
            <a class="btn secondary" href="custom.html">Back to your days</a>
        </div>
    </div>

    <dialog class="sheet picker" id="picker" aria-labelledby="picker-title">
        <div class="sheet-inner">
            <div class="picker-head">
                <div class="sheet-grab"></div>
                <div class="picker-top">
                    <h2 id="picker-title">Add exercise</h2>
                    <button type="button" class="mini-btn" data-picker-close>Done</button>
                </div>
                <input type="search" id="picker-search" class="picker-search" placeholder="Search exercises" autocomplete="off" aria-label="Search exercises">
                <div class="chip-row" id="picker-groups" role="group" aria-label="Muscle group"></div>
            </div>
            <div class="picker-body">
            <p class="sr-only" id="picker-status" role="status"></p>
            <div class="picker-list" id="picker-list"></div>
            <details class="own">
                <summary>Can't find it? Add your own</summary>
                <form id="own-form" novalidate>
                    <input name="n" type="text" maxlength="60" placeholder="Exercise name" autocomplete="off" aria-label="Exercise name">
                    <select name="g" id="own-group" aria-label="Muscle group"></select>
                    <input name="u" type="url" placeholder="Form video link (optional)" autocomplete="off" inputmode="url" aria-label="Form video link, optional">
                    <p class="form-error" id="own-error" role="alert"></p>
                    <button type="submit" class="btn">Add exercise</button>
                </form>
            </details>
            </div>
        </div>
    </dialog>

    <script src="exercises.js"></script>
    <script src="custom.js"></script>
    <script src="app.js"></script>
</body>
</html>
