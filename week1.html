<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Week 1 - Workout Days</title>
    
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background-color: #000000;
            color: #ffffff;
            font-family: Arial, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            padding: 40px 20px;
        }

        .header-container { text-align: center; width: 100%; max-width: 600px; margin-bottom: 30px; position: relative; }
        .back-link { color: #888888; text-decoration: none; font-size: 0.95rem; position: absolute; left: 0; top: 5px; transition: color 0.2s ease; }
        .back-link:hover { color: #0077ed; }
        
        h1 { font-size: 2rem; font-weight: bold; margin-bottom: 5px; }
        .phase-subtitle { color: #aaaaaa; font-size: 1rem; margin-bottom: 20px; letter-spacing: 1px; }
        hr { border: none; height: 1px; background-color: #444444; margin: 0 auto 30px auto; width: 75%; }

        .days-grid {
            display: grid;
            grid-template-columns: 1fr;
            gap: 20px;
            width: 100%;
            max-width: 400px;
        }

        .shiny-btn {
            background: linear-gradient(135deg, #0051a8, #0077ed, #00d2ff);
            background-size: 200% auto;
            color: #ffffff;
            border: 1px solid rgba(255, 255, 255, 0.3);
            padding: 20px;
            font-size: 1.2rem;
            font-weight: bold;
            border-radius: 10px;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(0, 119, 237, 0.5), inset 0 1px 2px rgba(255,255,255,0.4);
            transition: all 0.3s ease;
        }

        .shiny-btn:hover {
            background-position: right center;
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(0, 119, 237, 0.7), inset 0 1px 2px rgba(255,255,255,0.6);
        }
    </style>
</head>
<body>

    <div class="header-container">
        <a href="phase1.html" class="back-link">← Back</a>
        <h1>WEEK 1</h1>
        <div class="phase-subtitle">SELECT YOUR WORKOUT</div>
        <hr>
    </div>

    <main class="days-grid">
        <!-- These link to your actual exercise logging pages -->
        <button type="button" class="shiny-btn" onclick="window.location.href='day1-legs.html'">Day 1: LEGS</button>
        <button type="button" class="shiny-btn" onclick="window.location.href='day2-push.html'">Day 2: PUSH</button>
        <button type="button" class="shiny-btn" onclick="window.location.href='day3-pull.html'">Day 3: PULL</button>
<button type="button" class="shiny-btn" onclick="window.location.href='day4-fullbody.html'">Day 4: FULL BODY</button>    </main>

</body>
</html>
